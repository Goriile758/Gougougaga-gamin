
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOUGOUGAGA - Open Road</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91b9cf;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
canvas{display:block}
#top{position:fixed;top:15px;left:18px;z-index:5;text-shadow:0 2px 8px #000}
#top h1{margin:0;font-size:22px;letter-spacing:2px}
#top p{margin:5px 0;font-size:12px}
#camera{position:fixed;top:18px;right:18px;z-index:10;border:1px solid #ffffff66;border-radius:12px;padding:11px 15px;background:#14252ddd;color:white;font-weight:bold}
#speedbox{position:fixed;left:18px;bottom:20px;z-index:5;padding:12px 15px;border-radius:12px;background:#10202ddd;border:1px solid #ffffff33;min-width:115px}
#speed{font-size:25px;font-weight:bold}
#speedbox small{color:#c5d5d8}
#controls{position:fixed;right:18px;bottom:20px;z-index:8;display:flex;align-items:center;gap:16px;padding:13px;border-radius:16px;background:#10202ddd;border:1px solid #ffffff33}
.control{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:#d9e6e8}
input[type=range]{accent-color:#66d9c2;width:125px}
#steer{width:130px}
#accelerator{width:115px;transform:rotate(-90deg);margin:42px 0}
@media(max-width:600px){
#top h1{font-size:17px}
#top p{font-size:10px}
#controls{right:10px;bottom:12px;gap:9px;padding:9px}
#steer{width:105px}
#accelerator{width:95px}
#speedbox{left:10px;bottom:12px;min-width:90px;padding:9px}
#speed{font-size:20px}
#camera{top:65px;right:10px;padding:9px;font-size:11px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
<h1>GOUGOUGAGA</h1>
<p>OPEN ROAD · 3D DRIVING</p>
</div>

<button id="camera">CAMÉRA : EXTÉRIEURE</button>

<div id="speedbox">
<div id="speed">0</div>
<small>KM/H</small>
</div>

<div id="controls">
<div class="control">
<span>ACCÉLÉRER</span>
<input id="accelerator" type="range" min="0" max="100" value="0">
</div>
<div class="control">
<span>DIRECTION</span>
<input id="steer" type="range" min="-100" max="100" value="0">
</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const container=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ccbd7);
scene.fog=new THREE.Fog(0x9ccbd7,100,430);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe3f5ff,0x52634a,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-60,100,40);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(3000,3000),
new THREE.MeshStandardMaterial({color:0x587c50})
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.15,-500);
scene.add(ground);

const roadMaterial=new THREE.MeshStandardMaterial({color:0x34383b,roughness:1});
const edgeMaterial=new THREE.MeshStandardMaterial({color:0xe9e9df});
const treeMaterial=new THREE.MeshStandardMaterial({color:0x245638});
const trunkMaterial=new THREE.MeshStandardMaterial({color:0x65452d});
const mountainMaterial=new THREE.MeshStandardMaterial({color:0x84969a,roughness:1});

function roadX(z){
return Math.sin(z*.006)*22+Math.sin(z*.014)*7;
}

function block(parent,w,h,d,material,x,y,z){
const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
parent.add(mesh);
return mesh;
}

// Voiture
const car=new THREE.Group();
scene.add(car);

const red=new THREE.MeshStandardMaterial({color:0xc92727,roughness:.45});
const black=new THREE.MeshStandardMaterial({color:0x15191d});
const glass=new THREE.MeshStandardMaterial({color:0x8dc4d4,roughness:.2});

block(car,2.1,.65,4.1,red,0,.8,0);
block(car,1.65,.75,1.8,glass,0,1.45,-.25);
block(car,2,.16,1.2,red,0,1.05,-1.45);

const wheels=[];
for(const x of [-1.05,1.05]){
for(const z of [-1.25,1.25]){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.42,.42,.28,16),black
);
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,.48,z);
car.add(wheel);
wheels.push(wheel);
}
}

const headlights=new THREE.MeshStandardMaterial({
color:0xfff4c4,emissive:0xffd77a,emissiveIntensity:.5
});
block(car,.45,.2,.08,headlights,-.65,.88,-2.06);
block(car,.45,.2,.08,headlights,.65,.88,-2.06);

// Arbres
function makeTree(parent,x,z,scale){
const tree=new THREE.Group();
tree.position.set(x,0,z);
tree.scale.setScalar(scale);

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.16,.22,1.3,7),trunkMaterial
);
trunk.position.y=.65;
tree.add(trunk);

const leaves=new THREE.Mesh(
new THREE.ConeGeometry(1.05,3.2,8),treeMaterial
);
leaves.position.y=2.55;
leaves.castShadow=true;
tree.add(leaves);

parent.add(tree);
}

// Montagnes
function makeMountain(parent,x,z,size){
const mountain=new THREE.Mesh(
new THREE.ConeGeometry(size,size*1.5,7),mountainMaterial
);
mountain.position.set(x,size*.7,z);
mountain.castShadow=true;
parent.add(mountain);
}

// Génération de segments continus
const SEGMENT_LENGTH=40;
const SEGMENT_COUNT=32;
const ROAD_WIDTH=11;
const segments=[];

function createRoadGeometry(worldZ){
const positions=[];
const indices=[];
const steps=16;

for(let i=0;i<=steps;i++){
const localZ=-SEGMENT_LENGTH*i/steps;
const absoluteZ=worldZ+localZ;
const offset=roadX(absoluteZ)-roadX(worldZ);

positions.push(-ROAD_WIDTH/2+offset,0,localZ);
positions.push(ROAD_WIDTH/2+offset,0,localZ);

if(i<steps){
const a=i*2;
indices.push(a,a+1,a+2,a+1,a+3,a+2);
}
}

const geometry=new THREE.BufferGeometry();
geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
geometry.setIndex(indices);
geometry.computeVertexNormals();
return geometry;
}

function addSegmentMarkings(group,worldZ){
for(let z=-4;z>-SEGMENT_LENGTH;z-=8){
const absoluteZ=worldZ+z;
const offset=roadX(absoluteZ)-roadX(worldZ);

const dash=new THREE.Mesh(
new THREE.BoxGeometry(.16,.035,3),
edgeMaterial
);
dash.position.set(offset,.025,z);
group.add(dash);
}

for(const side of [-1,1]){
for(let i=0;i<8;i++){
const z=-2-i*5;
const offset=roadX(worldZ+z)-roadX(worldZ);

const edge=new THREE.Mesh(
new THREE.BoxGeometry(.12,.035,4.8),
edgeMaterial
);
edge.position.set(offset+side*5.35,.025,z);
group.add(edge);
}
}
}

function createSegment(worldZ){
const group=new THREE.Group();
group.position.set(roadX(worldZ),0,worldZ);
scene.add(group);

const road=new THREE.Mesh(createRoadGeometry(worldZ),roadMaterial);
road.receiveShadow=true;
group.add(road);

addSegmentMarkings(group,worldZ);

// Arbres hors de la chaussée
for(let i=0;i<6;i++){
const z=-4-i*6;
for(const side of [-1,1]){
const absoluteZ=worldZ+z;
const offset=roadX(absoluteZ)-roadX(worldZ);
const distance=9+Math.random()*12;
makeTree(group,offset+side*distance,z,.8+Math.random()*.7);
}
}

// Montagnes au loin
for(let i=0;i<3;i++){
const side=i%2===0?-1:1;
const z=-8-Math.random()*30;
const offset=roadX(worldZ+z)-roadX(worldZ);
makeMountain(
group,
offset+side*(35+Math.random()*35),
z,
12+Math.random()*20
);
}

segments.push({group,worldZ});
}

for(let i=-20;i<12;i++){
createSegment(i*SEGMENT_LENGTH);
}

car.position.set(roadX(0),0,0);

// Commandes
const accelerator=document.getElementById('accelerator');
const steering=document.getElementById('steer');
const speedDisplay=document.getElementById('speed');
const cameraButton=document.getElementById('camera');

let speed=0;
let steeringValue=0;
let firstPerson=false;
let lastTime=0;

steering.addEventListener('input',()=>{
steeringValue=Number(steering.value)/100;
});

cameraButton.addEventListener('click',()=>{
firstPerson=!firstPerson;
cameraButton.textContent=firstPerson
?'CAMÉRA : INTÉRIEURE'
:'CAMÉRA : EXTÉRIEURE';
});

// Déplacement et limites de la route
function updateCar(delta){
const targetSpeed=Number(accelerator.value)*.55;
speed+=(targetSpeed-speed)*Math.min(delta*1.8,1);

const movement=speed*delta*.55;
car.position.z-=movement;

// Position de la route sous la voiture
const center=roadX(car.position.z);

// La voiture peut tourner, mais reste sur la chaussée
let offset=car.position.x-center;
const wantedOffset=steeringValue*4.1;
offset+=(wantedOffset-offset)*Math.min(delta*2.8,1);
offset=THREE.MathUtils.clamp(offset,-4.1,4.1);

car.position.x=center+offset;

// Les roues tournent avec la voiture
wheels.forEach(wheel=>{
wheel.rotation.x+=movement*.8;
});

// Petite inclinaison dans les virages
car.rotation.z=-steeringValue*.035;

// Ralentissement léger si elle touche les limites
if(Math.abs(offset)>3.9){
speed*=.985;
}

speedDisplay.textContent=Math.round(speed);
}

// Déplacement des morceaux de route
function updateWorld(){
let frontmost=Math.min(...segments.map(s=>s.worldZ));

for(const segment of segments){
if(segment.worldZ>car.position.z+80){
segment.worldZ=frontmost-SEGMENT_LENGTH;
frontmost=segment.worldZ;

scene.remove(segment.group);
segment.group.traverse(object=>{
if(object.geometry)object.geometry.dispose();
});
const index=segments.indexOf(segment);
segments.splice(index,1);
createSegment(segment.worldZ);
break;
}
}
}

// Caméras
function updateCamera(){
if(firstPerson){
camera.position.set(
car.position.x,
1.65,
car.position.z-.25
);
camera.lookAt(
car.position.x+steeringValue*2,
1.5,
car.position.z-30
);
}else{
const desired=new THREE.Vector3(
car.position.x+steeringValue*2,
5.5,
car.position.z+10
);
camera.position.lerp(desired,.09);
camera.lookAt(
car.position.x,
1.1,
car.position.z-8
);
}
}

function animate(time){
requestAnimationFrame(animate);
const delta=Math.min((time-lastTime)/1000||0,.04);
lastTime=time;

updateCar(delta);
updateWorld();
updateCamera();

renderer.render(scene,camera);
}

requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
