
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountain Drive 3D - Gougougaga</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:clamp(20px,4vw,32px);margin:10px 0}
.stats{display:flex;justify-content:space-between;padding:8px 3%;font-size:17px}
#game{width:96%;height:65vh;min-height:340px;max-height:720px;margin:auto;overflow:hidden;border-radius:15px;background:#9db9d1}
#game canvas{display:block;width:100%;height:100%}
.help{color:#aaa;margin:12px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px}
button{background:#3478ed;color:white;border:0;border-radius:12px;padding:17px 25px;font-size:23px;font-weight:bold;cursor:pointer;touch-action:none}
button:active{background:#174ba8;transform:scale(.96)}
#back{font-size:16px;margin:5px 0 20px}
</style>
</head>
<body>

<header>
<h1>🚗 Mountain Drive 3D</h1>
<span>GOUGOUGAGA</span>
</header>

<div class="stats">
<span>Vitesse : <b id="speed">80</b> km/h</span>
<span>Distance : <b id="distance">0</b> m</span>
</div>

<div id="game"></div>
<p class="help">Utilise les boutons pour conduire sur les routes de montagne.</p>

<div class="controls">
<button id="left">◀</button>
<button id="slower">−</button>
<button id="faster">+</button>
<button id="right">▶</button>
</div>

<button id="back">RETOUR AU SITE</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const container=document.getElementById('game');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bbbd6);
scene.fog=new THREE.Fog(0x9bbbd6,100,650);

const camera=new THREE.PerspectiveCamera(65,1,0.1,1500);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

function resize(){
const w=container.clientWidth,h=container.clientHeight;
renderer.setSize(w,h,false);
camera.aspect=w/h;
camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(container);
resize();

// Lumières
scene.add(new THREE.HemisphereLight(0xdceeff,0x58634d,2));

const sun=new THREE.DirectionalLight(0xfff1d5,3);
sun.position.set(-80,150,80);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// Sol
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(3000,6000),
new THREE.MeshStandardMaterial({color:0x536b50})
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.5,-2300);
ground.receiveShadow=true;
scene.add(ground);

// Route sinueuse
function roadX(z){
return 38*Math.sin(-z*0.00125)+
19*Math.sin(-z*0.0027)+
10*Math.sin(-z*0.00055);
}

const roadPoints=[];
for(let i=0;i<=1200;i++){
const z=100-i*4;
roadPoints.push(new THREE.Vector3(roadX(z),0,z));
}

const roadCurve=new THREE.CatmullRomCurve3(roadPoints);
const samples=1800;
const roadVertices=[];
const roadIndices=[];

for(let i=0;i<=samples;i++){
const t=i/samples;
const p=roadCurve.getPointAt(t);
const tangent=roadCurve.getTangentAt(t);
const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();

roadVertices.push(
p.x-side.x*7,0.02,p.z-side.z*7,
p.x+side.x*7,0.02,p.z+side.z*7
);
if(i<samples){
const a=i*2;
roadIndices.push(a,a+1,a+2,a+1,a+3,a+2);
}
}

const roadGeometry=new THREE.BufferGeometry();
roadGeometry.setAttribute('position',new THREE.Float32BufferAttribute(roadVertices,3));
roadGeometry.setIndex(roadIndices);
roadGeometry.computeVertexNormals();

const road=new THREE.Mesh(roadGeometry,new THREE.MeshStandardMaterial({
color:0x30343b,roughness:0.95,side:THREE.DoubleSide
}));
road.receiveShadow=true;
scene.add(road);

// Bordures de route
function createRoadLine(offset,color){
const points=[];
for(let i=0;i<=samples;i+=3){
const p=roadCurve.getPointAt(i/samples);
const t=roadCurve.getTangentAt(i/samples);
points.push(new THREE.Vector3(p.x-t.z*offset,0.08,p.z+t.x*offset));
}
const line=new THREE.Line(
new THREE.BufferGeometry().setFromPoints(points),
new THREE.LineBasicMaterial({color})
);
scene.add(line);
}
createRoadLine(-6.8,0xffffff);
createRoadLine(6.8,0xffffff);

// Ligne centrale discontinue
for(let z=0;z>-4750;z-=22){
const x=roadX(z);
const mark=new THREE.Mesh(
new THREE.BoxGeometry(0.22,0.035,8),
new THREE.MeshBasicMaterial({color:0xffffff})
);
mark.position.set(x,0.09,z);
mark.rotation.y=-(roadX(z-1)-roadX(z+1))*0.04;
scene.add(mark);
}

// Matériaux
const treeGreen=new THREE.MeshStandardMaterial({color:0x174a35});
const treeLight=new THREE.MeshStandardMaterial({color:0x286344});
const trunkMat=new THREE.MeshStandardMaterial({color:0x59402e});
const rockMat=new THREE.MeshStandardMaterial({color:0x8798a4,flatShading:true});

// Montagnes
for(let i=0;i<150;i++){
const z=-20-Math.random()*4800;
const side=Math.random()<0.5?-1:1;
const x=roadX(z)+side*(35+Math.random()*110);
const height=35+Math.random()*100;
const mountain=new THREE.Mesh(
new THREE.ConeGeometry(height*.65,height,5),
rockMat
);
mountain.position.set(x,height/2-1,z);
mountain.rotation.y=Math.random()*Math.PI;
mountain.castShadow=true;
scene.add(mountain);
}

// Sapins
const trunkGeo=new THREE.CylinderGeometry(.25,.4,2,6);
const leavesGeo=new THREE.ConeGeometry(2.8,8,7);

for(let i=0;i<400;i++){
const z=-Math.random()*4800;
const side=Math.random()<0.5?-1:1;
const x=roadX(z)+side*(12+Math.random()*65);

const tree=new THREE.Group();
const trunk=new THREE.Mesh(trunkGeo,trunkMat);
trunk.position.y=1;
tree.add(trunk);

const leaves=new THREE.Mesh(leavesGeo,Math.random()<.5?treeGreen:treeLight);
leaves.position.y=5;
tree.add(leaves);

const leaves2=new THREE.Mesh(new THREE.ConeGeometry(2.1,6,7),treeGreen);
leaves2.position.y=8;
tree.add(leaves2);

tree.position.set(x,0,z);
tree.scale.setScalar(.7+Math.random()*.8);
tree.castShadow=true;
scene.add(tree);
}

// Voiture
const car=new THREE.Group();

const red=new THREE.MeshStandardMaterial({color:0xc91f25,metalness:.45,roughness:.3});
const dark=new THREE.MeshStandardMaterial({color:0x111820,metalness:.4,roughness:.3});
const glass=new THREE.MeshStandardMaterial({color:0x152e43,metalness:.5,roughness:.15});
const tireMat=new THREE.MeshStandardMaterial({color:0x090909,roughness:.9});
const lightMat=new THREE.MeshStandardMaterial({color:0xffe8ad,emissive:0xffaa44,emissiveIntensity:1.5});

function carPart(geometry,material,x,y,z){
const mesh=new THREE.Mesh(geometry,material);
mesh.position.set(x,y,z);
mesh.castShadow=true;
car.add(mesh);
return mesh;
}

// Châssis et carrosserie
carPart(new THREE.BoxGeometry(3.3,.9,5),red,0,1,0);
carPart(new THREE.BoxGeometry(2.5,1.05,2.5),red,0,1.85,.2);
carPart(new THREE.BoxGeometry(2.25,.85,2.1),glass,0,2,.2);

// Pare-chocs
carPart(new THREE.BoxGeometry(3.4,.3,.35),dark,0,.7,-2.5);
carPart(new THREE.BoxGeometry(3.4,.3,.35),dark,0,.7,2.5);

// Phares et feux
for(const x of [-1.15,1.15]){
carPart(new THREE.BoxGeometry(.45,.25,.12),lightMat,x,1.1,-2.55);
carPart(new THREE.BoxGeometry(.45,.22,.12),
new THREE.MeshStandardMaterial({color:0xff1111,emissive:0xaa0000}),x,1.1,2.55);
}

// Roues
const wheels=[];
for(const x of [-1.65,1.65]){
for(const z of [-1.55,1.55]){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.58,.58,.38,24),
tireMat
);
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,.65,z);
wheel.castShadow=true;
car.add(wheel);
wheels.push(wheel);
}}
scene.add(car);

// État du jeu
let speed=80;
let distance=0;
let steering=0;
let lane=0;
let leftPressed=false;
let rightPressed=false;

function hold(id,callback){
const b=document.getElementById(id);
b.addEventListener('pointerdown',e=>{
e.preventDefault();
callback(true);
});
b.addEventListener('pointerup',()=>callback(false));
b.addEventListener('pointerleave',()=>callback(false));
b.addEventListener('pointercancel',()=>callback(false));
}

hold('left',v=>leftPressed=v);
hold('right',v=>rightPressed=v);

document.getElementById('faster').addEventListener('click',()=>speed=Math.min(220,speed+10));
document.getElementById('slower').addEventListener('click',()=>speed=Math.max(0,speed-10));
document.getElementById('back').addEventListener('click',()=>location.href='./');

// Boucle du jeu
let previous=performance.now();

function animate(now){
requestAnimationFrame(animate);

const dt=Math.min((now-previous)/1000,.05);
previous=now;

const forward=speed/3.6;

distance+=forward*dt;
const z=-distance;

if(leftPressed) steering=THREE.MathUtils.lerp(steering,-1,.08);
else if(rightPressed) steering=THREE.MathUtils.lerp(steering,1,.08);
else steering=THREE.MathUtils.lerp(steering,0,.05);

lane+=steering*12*dt;
lane=THREE.MathUtils.clamp(lane,-5.2,5.2);

const center=roadX(z);
car.position.set(center+lane,0,z);
car.rotation.y=-Math.atan((roadX(z-3)-roadX(z+3))/6);
car.rotation.y-=steering*.16;

wheels.forEach(w=>w.rotation.x+=forward*dt*1.8);

// Caméra derrière la voiture
const targetX=center+lane;
const desired=new THREE.Vector3(targetX+steering*2,8,z+17);
camera.position.lerp(desired,Math.min(1,dt*4));
camera.lookAt(roadX(z-22),2,z-25);

// Interface
document.getElementById('speed').textContent=Math.round(speed);
document.getElementById('distance').textContent=Math.floor(distance);

renderer.render(scene,camera);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
