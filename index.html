
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mountain Drive 3D - Gougougaga</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0d12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 42px;
  padding: 5px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 21px;
  margin: 0;
}

header span {
  font-size: 13px;
  color: #aaa;
}

.stats {
  height: 32px;
  padding: 3px 15px;
  display: flex;
  justify-content: space-between;
  font-size: 15px;
}

#game {
  width: 100%;
  height: calc(100dvh - 74px);
  position: relative;
  overflow: hidden;
  background: #9bbbd6;
}

#game canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.touch-controls {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 15px;
  pointer-events: none;
}

.panel {
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 20, 35, .78);
  border: 1px solid rgba(120, 150, 210, .3);
  border-radius: 20px;
  padding: 12px;
  backdrop-filter: blur(8px);
}

.panel label {
  color: #b9c8e0;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}

.accelerator {
  width: 76px;
  height: 175px;
  flex-direction: column;
  gap: 12px;
}

.accelerator input {
  width: 135px;
  height: 35px;
  writing-mode: vertical-lr;
  direction: rtl;
}

.direction {
  width: 175px;
  height: 80px;
  flex-direction: column;
  gap: 10px;
}

.direction input {
  width: 135px;
}

input[type=range] {
  accent-color: #3478ed;
  touch-action: none;
  cursor: pointer;
}

@media (max-width: 600px) {
  .touch-controls {
    padding: 9px;
  }

  .accelerator {
    width: 64px;
    height: 145px;
  }

  .direction {
    width: 145px;
    height: 70px;
  }

  header h1 {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚗 Mountain Drive 3D</h1>
  <span>GOUGOUGAGA</span>
</header>

<div class="stats">
  <span>Vitesse : <b id="speed">80</b> km/h</span>
  <span>Distance : <b id="distance">0</b> m</span>
</div>

<div id="game">

  <div class="touch-controls">

    <div class="panel accelerator">
      <label>VITESSE</label>
      <input
        id="speedSlider"
        type="range"
        min="0"
        max="220"
        value="80"
        aria-label="Accélérer ou ralentir"
      >
    </div>

    <div class="panel direction">
      <label>DIRECTION</label>
      <input
        id="directionSlider"
        type="range"
        min="-100"
        max="100"
        value="0"
        aria-label="Tourner à gauche ou à droite"
      >
    </div>

  </div>

</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const container = document.getElementById('game');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bbbd6);
scene.fog = new THREE.Fog(0x9bbbd6, 100, 650);

const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 1500);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

new ResizeObserver(resize).observe(container);
resize();

// LUMIERES

scene.add(new THREE.HemisphereLight(0xdceeff, 0x58634d, 2));

const sun = new THREE.DirectionalLight(0xfff1d5, 3);
sun.position.set(-80, 150, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// SOL

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(3000, 6000),
  new THREE.MeshStandardMaterial({color:0x536b50})
);

ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.5, -2300);
ground.receiveShadow = true;
scene.add(ground);

// ROUTE

function roadX(z) {
  return 38 * Math.sin(-z * 0.00125)
       + 19 * Math.sin(-z * 0.0027)
       + 10 * Math.sin(-z * 0.00055);
}

const roadPoints = [];

for (let i = 0; i <= 1200; i++) {
  const z = 100 - i * 4;
  roadPoints.push(new THREE.Vector3(roadX(z), 0, z));
}

const roadCurve = new THREE.CatmullRomCurve3(roadPoints);
const samples = 1800;
const vertices = [];
const indices = [];

for (let i = 0; i <= samples; i++) {
  const p = roadCurve.getPointAt(i / samples);
  const t = roadCurve.getTangentAt(i / samples);

  const side = new THREE.Vector3(-t.z, 0, t.x).normalize();

  vertices.push(
    p.x - side.x * 7, 0.02, p.z - side.z * 7,
    p.x + side.x * 7, 0.02, p.z + side.z * 7
  );

  if (i < samples) {
    const a = i * 2;
    indices.push(a, a+1, a+2, a+1, a+3, a+2);
  }
}

const roadGeometry = new THREE.BufferGeometry();
roadGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(vertices, 3)
);
roadGeometry.setIndex(indices);
roadGeometry.computeVertexNormals();

const road = new THREE.Mesh(
  roadGeometry,
  new THREE.MeshStandardMaterial({
    color:0x30343b,
    roughness:0.95,
    side:THREE.DoubleSide
  })
);

road.receiveShadow = true;
scene.add(road);

// BORDURES

function createRoadLine(offset) {
  const points = [];

  for (let i = 0; i <= samples; i += 3) {
    const p = roadCurve.getPointAt(i / samples);
    const t = roadCurve.getTangentAt(i / samples);

    points.push(new THREE.Vector3(
      p.x - t.z * offset,
      0.08,
      p.z + t.x * offset
    ));
  }

  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({color:0xffffff})
  ));
}

createRoadLine(-6.8);
createRoadLine(6.8);

// LIGNE CENTRALE

for (let z = 0; z > -4750; z -= 22) {
  const mark = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.035, 8),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );

  mark.position.set(roadX(z), 0.09, z);
  mark.rotation.y = -(roadX(z-1) - roadX(z+1)) * 0.04;
  scene.add(mark);
}

// MONTAGNES

const rockMat = new THREE.MeshStandardMaterial({
  color:0x8798a4,
  flatShading:true
});

for (let i = 0; i < 150; i++) {
  const z = -20 - Math.random() * 4800;
  const side = Math.random() < 0.5 ? -1 : 1;
  const height = 35 + Math.random() * 100;

  const radius = height * 0.65;

  const mountain = new THREE.Mesh(
    new THREE.ConeGeometry(radius, height, 5),
    rockMat
  );

  mountain.position.set(
    roadX(z) + side * (radius + 18 + Math.random() * 35),
    height / 2 - 1,
    z
  );

  mountain.rotation.y = Math.random() * Math.PI;
  mountain.castShadow = true;
  mountain.receiveShadow = true;
  scene.add(mountain);
}

// SAPINS

const trunkMat = new THREE.MeshStandardMaterial({color:0x59402e});
const treeGreen = new THREE.MeshStandardMaterial({color:0x174a35});
const treeLight = new THREE.MeshStandardMaterial({color:0x286344});

const trunkGeo = new THREE.CylinderGeometry(.25, .4, 2, 6);
const leavesGeo = new THREE.ConeGeometry(2.8, 8, 7);

for (let i = 0; i < 400; i++) {
  const z = -Math.random() * 4800;
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = roadX(z) + side * (18 + Math.random() * 65);

  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1;
  tree.add(trunk);

  const leaves = new THREE.Mesh(
    leavesGeo,
    Math.random() < .5 ? treeGreen : treeLight
  );

  leaves.position.y = 5;
  tree.add(leaves);

  const leaves2 = new THREE.Mesh(
    new THREE.ConeGeometry(2.1, 6, 7),
    treeGreen
  );

  leaves2.position.y = 8;
  tree.add(leaves2);

  tree.position.set(x, 0, z);
  tree.scale.setScalar(.7 + Math.random() * .8);
  tree.castShadow = true;
  scene.add(tree);
}

// VOITURE

const car = new THREE.Group();

const red = new THREE.MeshStandardMaterial({
  color:0xc91f25,
  metalness:.45,
  roughness:.3
});

const dark = new THREE.MeshStandardMaterial({color:0x111820});
const glass = new THREE.MeshStandardMaterial({
  color:0x152e43,
  metalness:.5,
  roughness:.15
});

const tireMat = new THREE.MeshStandardMaterial({color:0x090909});

function carPart(geometry, material, x, y, z) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  car.add(mesh);
  return mesh;
}

carPart(new THREE.BoxGeometry(3.3,.9,5), red, 0,1,0);
carPart(new THREE.BoxGeometry(2.5,1.05,2.5), red, 0,1.85,.2);
carPart(new THREE.BoxGeometry(2.25,.85,2.1), glass, 0,2,.2);

carPart(new THREE.BoxGeometry(3.4,.3,.35), dark, 0,.7,-2.5);
carPart(new THREE.BoxGeometry(3.4,.3,.35), dark, 0,.7,2.5);

const lightMat = new THREE.MeshStandardMaterial({
  color:0xffe8ad,
  emissive:0xffaa44,
  emissiveIntensity:1.5
});

for (const x of [-1.15,1.15]) {
  carPart(new THREE.BoxGeometry(.45,.25,.12), lightMat, x,1.1,-2.55);

  carPart(
    new THREE.BoxGeometry(.45,.22,.12),
    new THREE.MeshStandardMaterial({color:0xff1111, emissive:0xaa0000}),
    x,1.1,2.55
  );
}

const wheels = [];

for (const x of [-1.65,1.65]) {
  for (const z of [-1.55,1.55]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(.58,.58,.38,24),
      tireMat
    );

    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x,.65,z);
    wheel.castShadow = true;
    car.add(wheel);
    wheels.push(wheel);
  }
}

scene.add(car);

// COMMANDES TACTILES

let speed = 80;
let distance = 0;
let steering = 0;
let targetSteering = 0;
let lane = 0;

const speedSlider = document.getElementById('speedSlider');
const directionSlider = document.getElementById('directionSlider');

speedSlider.addEventListener('input', () => {
  speed = Number(speedSlider.value);
});

directionSlider.addEventListener('input', () => {
  targetSteering = Number(directionSlider.value) / 100;
});

// BOUCLE DU JEU

let previous = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - previous) / 1000, .05);
  previous = now;

  const forward = speed / 3.6;

  distance += forward * dt;
  const z = -distance;

  steering = THREE.MathUtils.lerp(
    steering,
    targetSteering,
    Math.min(1, dt * 5)
  );

  lane += steering * 12 * dt;
  lane = THREE.MathUtils.clamp(lane, -5.2, 5.2);

  const center = roadX(z);

  car.position.set(center + lane, 0, z);
  car.rotation.y = -Math.atan(
    (roadX(z-3) - roadX(z+3)) / 6
  );

  car.rotation.y -= steering * .16;

  wheels.forEach(w => {
    w.rotation.x += forward * dt * 1.8;
  });

  // CAMERA

  const desired = new THREE.Vector3(
    center + lane + steering * 2,
    8,
    z + 17
  );

  camera.position.lerp(desired, Math.min(1, dt * 4));

  camera.lookAt(roadX(z-22), 2, z-25);

  // AFFICHAGE

  document.getElementById('speed').textContent =
    Math.round(speed);

  document.getElementById('distance').textContent =
    Math.floor(distance);

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

</script>
</body>
</html>
