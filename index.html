
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOUGOUGAGA - Open Road</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101820;
      font-family: Arial, sans-serif;
      color: white;
    }
    #game { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #top {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
    }
    #top h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
    #top p { margin: 5px 0; font-size: 12px; color: #d5e5e8; }
    #camera {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
      border: 1px solid #ffffff66;
      border-radius: 12px;
      padding: 11px 15px;
      background: #14252dcc;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #speedbox {
      position: fixed;
      left: 18px;
      bottom: 20px;
      z-index: 5;
      padding: 12px 15px;
      border-radius: 12px;
      background: #10202dcc;
      border: 1px solid #ffffff33;
      min-width: 115px;
    }
    #speed { font-size: 25px; font-weight: bold; }
    #speedbox small { color: #c5d5d8; }
    #controls {
      position: fixed;
      right: 18px;
      bottom: 20px;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 13px;
      border-radius: 16px;
      background: #10202dcc;
      border: 1px solid #ffffff33;
    }
    .control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #d9e6e8;
    }
    input[type=range] {
      accent-color: #66d9c2;
      width: 125px;
      cursor: pointer;
    }
    #steer { width: 130px; }
    #accelerator {
      width: 115px;
      transform: rotate(-90deg);
      margin: 42px 0;
    }
    #hint {
      position: fixed;
      bottom: 105px;
      right: 20px;
      color: white;
      font-size: 11px;
      opacity: .8;
      z-index: 5;
      text-shadow: 0 1px 5px black;
    }
    @media(max-width:600px) {
      #top h1 { font-size: 17px; }
      #top p { font-size: 10px; }
      #controls { right: 10px; bottom: 12px; gap: 9px; padding: 9px; }
      #steer { width: 105px; }
      #accelerator { width: 95px; }
      #speedbox { left: 10px; bottom: 12px; min-width: 90px; padding: 9px; }
      #speed { font-size: 20px; }
      #camera { top: 65px; right: 10px; padding: 9px; font-size: 11px; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="top">
    <h1>GOUGOUGAGA</h1>
    <p>OPEN ROAD · 3D DRIVING</p>
  </div>

  <button id="camera">CAMÉRA : EXTÉRIEURE</button>

  <div id="speedbox">
    <div id="speed">0</div>
    <small>KM/H</small>
  </div>

  <div id="hint">Curseur vertical : vitesse · Curseur horizontal : direction</div>

  <div id="controls">
    <div class="control">
      <span>ACCÉLÉRER</span>
      <input id="accelerator" type="range" min="0" max="100" value="0">
    </div>
    <div class="control">
      <span>DIRECTION</span>
      <input id="steer" type="range" min="-100" max="100" value="0">
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const container = document.getElementById('game');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ccbd7);
    scene.fog = new THREE.Fog(0x9ccbd7, 90, 420);

    const camera = new THREE.PerspectiveCamera(
      70, window.innerWidth / window.innerHeight, 0.1, 700
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xd9f2ff, 0x53634c, 2));

    const sun = new THREE.DirectionalLight(0xffffff, 2.1);
    sun.position.set(-60, 100, 40);
    sun.castShadow = true;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(2000, 2000),
      new THREE.MeshStandardMaterial({ color: 0x557c4b })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.12;
    ground.position.z = -500;
    ground.receiveShadow = true;
    scene.add(ground);

    const roadMaterial = new THREE.MeshStandardMaterial({
      color: 0x34383b, roughness: 0.95
    });
    const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f0d5 });
    const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x668b53 });

    const car = new THREE.Group();
    scene.add(car);

    const red = new THREE.MeshStandardMaterial({ color: 0xc92727, roughness: 0.45 });
    const black = new THREE.MeshStandardMaterial({ color: 0x15191d, roughness: 0.8 });
    const glass = new THREE.MeshStandardMaterial({
      color: 0x8dc4d4, metalness: 0.25, roughness: 0.2
    });

    function block(parent, w, h, d, material, x, y, z) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d), material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    block(car, 2.1, 0.65, 4.1, red, 0, 0.8, 0);
    block(car, 1.65, 0.75, 1.8, glass, 0, 1.45, -0.25);
    block(car, 2.0, 0.16, 1.2, red, 0, 1.05, -1.45);

    const wheels = [];
    for (const x of [-1.05, 1.05]) {
      for (const z of [-1.25, 1.25]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.42, 0.42, 0.28, 16),
          black
        );
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, 0.48, z);
        wheel.castShadow = true;
        car.add(wheel);
        wheels.push(wheel);
      }
    }

    const headlights = new THREE.MeshStandardMaterial({
      color: 0xfff4c4, emissive: 0xffd77a, emissiveIntensity: 0.5
    });
    block(car, 0.45, 0.2, 0.08, headlights, -0.65, 0.88, -2.06);
    block(car, 0.45, 0.2, 0.08, headlights, 0.65, 0.88, -2.06);

    function roadX(z) {
      return Math.sin(z * 0.006) * 22 + Math.sin(z * 0.014) * 7;
    }

    const segments = [];
    const segmentLength = 40;
    const segmentCount = 32;

    function makeTree(parent, x, z, scale) {
      const tree = new THREE.Group();
      tree.position.set(x, 0, z);
      tree.scale.setScalar(scale);

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.22, 1.3, 7),
        new THREE.MeshStandardMaterial({ color: 0x61432c })
      );
      trunk.position.y = 0.65;
      tree.add(trunk);

      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.05, 3.2, 8),
        new THREE.MeshStandardMaterial({ color: 0x245638 })
      );
      leaves.position.y = 2.55;
      leaves.castShadow = true;
      tree.add(leaves);
      parent.add(tree);
    }

    function makeMountain(parent, x, z, size) {
      const mountain = new THREE.Mesh(
        new THREE.ConeGeometry(size, size * 1.5, 7),
        new THREE.MeshStandardMaterial({ color: 0x788b83, roughness: 1 })
      );
      mountain.position.set(x, size * 0.7, z);
      mountain.castShadow = true;
      parent.add(mountain);
    }

    function createSegment(z) {
      const group = new THREE.Group();
      group.position.z = z;
      scene.add(group);

      const center = roadX(z - segmentLength / 2);

      const road = new THREE.Mesh(
        new THREE.PlaneGeometry(11, segmentLength),
        roadMaterial
      );
      road.rotation.x = -Math.PI / 2;
      road.position.set(center, 0, -segmentLength / 2);
      road.receiveShadow = true;
      group.add(road);

      for (const side of [-1, 1]) {
        const edge = new THREE.Mesh(
          new THREE.BoxGeometry(0.16, 0.04, segmentLength),
          lineMaterial
        );
        edge.position.set(center + side * 5.3, 0.035, -segmentLength / 2);
        group.add(edge);
      }

      for (let i = 0; i < 5; i++) {
        const localZ = -5 - i * 7;
        for (const side of [-1, 1]) {
          const treeX = center + side * (9 + Math.random() * 13);
          makeTree(group, treeX - center, localZ, 0.8 + Math.random() * 0.8);
        }
      }

      for (let i = 0; i < 3; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        makeMountain(
          group,
          side * (35 + Math.random() * 35) - center,
          -10 - Math.random() * 30,
          12 + Math.random() * 20
        );
      }

      segments.push(group);
    }

    for (let i = -20; i < 12; i++) {
      createSegment(i * segmentLength);
    }

    car.position.set(roadX(0), 0, 0);

    const accelerator = document.getElementById('accelerator');
    const steering = document.getElementById('steer');
    const speedDisplay = document.getElementById('speed');
    const cameraButton = document.getElementById('camera');

    let speed = 0;
    let steeringValue = 0;
    let firstPerson = false;
    let lastTime = 0;

    steering.addEventListener('input', () => {
      steeringValue = Number(steering.value) / 100;
    });

    cameraButton.addEventListener('click', () => {
      firstPerson = !firstPerson;
      cameraButton.textContent = firstPerson
        ? 'CAMÉRA : INTÉRIEURE'
        : 'CAMÉRA : EXTÉRIEURE';
    });

    function animate(time) {
      requestAnimationFrame(animate);

      const delta = Math.min((time - lastTime) / 1000 || 0, 0.04);
      lastTime = time;

      const targetSpeed = Number(accelerator.value) * 0.55;
      speed += (targetSpeed - speed) * Math.min(delta * 1.8, 1);

      const movement = speed * delta * 0.55;
      car.position.z -= movement;

      const desiredX = roadX(car.position.z) + steeringValue * 8;
      car.position.x += (desiredX - car.position.x) * Math.min(delta * 2.5, 1);

      // Petite limite de route : ralentissement quand la voiture sort trop loin.
      const distanceFromRoad = Math.abs(car.position.x - roadX(car.position.z));
      if (distanceFromRoad > 7.2) {
        speed *= 0.96;
      }

      wheels.forEach(wheel => {
        wheel.rotation.x += movement * 0.8;
      });

      // Réutilisation des segments pour prolonger la route.
      for (const segment of segments) {
        if (segment.position.z > car.position.z + 100) {
          segment.position.z -= segmentCount * segmentLength;
        }
      }

      if (firstPerson) {
        camera.position.set(
          car.position.x,
          1.65,
          car.position.z - 0.25
        );
        camera.lookAt(
          car.position.x + steeringValue * 2,
          1.5,
          car.position.z - 30
        );
      } else {
        const desiredCamera = new THREE.Vector3(
          car.position.x + steeringValue * 2,
          5.5,
          car.position.z + 10
        );
        camera.position.lerp(desiredCamera, 0.09);
        camera.lookAt(car.position.x, 1.1, car.position.z - 8);
      }

      speedDisplay.textContent = Math.round(speed);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
